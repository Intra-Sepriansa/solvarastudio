name: ci

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, redis, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan wayfinder:generate --with-form --no-interaction

      - name: Lint frontend
        run: npm run lint:check

      - name: Check frontend formatting
        run: npm run format:check

      - name: Typecheck frontend
        run: npm run types:check

      - name: Build frontend
        run: npm run build

      - name: Check PHP style
        run: composer lint:check

      - name: Run backend tests
        run: php artisan test --compact

      - name: Migration check
        run: |
          touch database/database.sqlite
          DB_CONNECTION=sqlite DB_DATABASE=database/database.sqlite php artisan migrate --pretend --no-interaction

  deploy-placeholder:
    runs-on: ubuntu-latest
    needs: checks
    if: ${{ github.event_name == 'workflow_dispatch' && false }}
    steps:
      - name: Deployment placeholder
        run: echo "Add production deploy steps after server credentials and release strategy are approved."
